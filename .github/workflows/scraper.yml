name: Job Scraper

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:        # permite rodar manualmente pelo site

permissions:
  contents: write

concurrency:
  group: job-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Sem isso, um install que trava segura o concurrency group por horas
    # e nenhum run seguinte consegue iniciar.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pacotes pip
        timeout-minutes: 5
        run: pip install -r requirements.txt

      - name: Instalar navegador do Playwright
        timeout-minutes: 8
        run: playwright install chromium

      - name: Instalar dependencias de sistema
        timeout-minutes: 10
        run: |
          # O mirror azure.archive.ubuntu.com do runner esta respondendo
          # Ign: em cadeia e o install-deps nunca termina. O fallback para
          # archive.ubuntu.com so acontece apos minutos de retry.
          for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/*.list /etc/apt/sources.list; do
            if [ -f "$f" ]; then
              sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' "$f"
            fi
          done
          playwright install-deps

      - name: Rodar scraper
        timeout-minutes: 15
        env:
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: "587"
          EMAIL_USE_TLS: "true"
          EMAIL_USE_SSL: "false"
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python scraper.py --once

      - name: Commit seen jobs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add seen_jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualiza vagas vistas"
            git push
          fi
